# Blocking CI gate for the meeting-note monorepo.
#
# Three independent, blocking jobs run on every PR and every push to main:
#   - backend:  the workflow-server suite (529 tests + the gemini drift test)
#   - frontend: the root web build + the Vitest suite
#   - lint:     eslint over the whole repo under --max-warnings 0 (0 problems)
#
# Node 22 matches the local dev environment.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    name: backend (workflow-server tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workflow-server/package-lock.json

      - name: Install dependencies
        working-directory: workflow-server
        run: npm ci

      - name: Build
        working-directory: workflow-server
        run: npm run build

      - name: Test
        working-directory: workflow-server
        run: npm test

  frontend:
    name: frontend (web build + vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test:run

  lint:
    name: lint (eslint, 0 problems)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
