# Auto-tag a mobile release when its marketing version is bumped.
#
# The mobile pubspec `version:` (e.g. 0.1.2) is the only human-bumped release
# number in this monorepo (web/backend/mcp are traced by commit SHA, not a
# version). When a push to main changes that file, this workflow reads the
# current version and, if no matching tag exists yet, creates and pushes
# `mobile-v<version>`. Idempotent: an unchanged version already has its tag, so
# nothing happens.
#
# Scope: this tag tracks the **Android** release line, which is what
# `meeting-note-mobile/build_apk.sh` derives its versionName/versionCode from.
#
# iOS is deliberately outside it. `ios/Runner/Info.plist` reads
# `$(MARKETING_VERSION)` / `$(CURRENT_PROJECT_VERSION)` from the Xcode project
# instead of pubspec, so bumping pubspec does not move the iOS build and a
# `mobile-v*` tag does not describe what shipped to TestFlight. The reason is
# that Xcode-driven builds (Run, Archive) never see `--build-name`/
# `--build-number`: those only reach `ios/Flutter/Generated.xcconfig`, which is
# gitignored and gets rewritten to the pubspec values by any `flutter pub get`.
# Archiving after that silently produced the wrong version. Keeping the iOS
# numbers in `project.pbxproj` puts them under version control and removes that
# trap. Bump the iOS build number in Xcode (or `xcrun agvtool new-version -all
# N`) before each TestFlight upload. See `meeting-note-mobile/IOS_AGENT_HANDOFF.md`.
name: tag-mobile-release

on:
  push:
    branches: [main]
    paths:
      - 'meeting-note-mobile/app/pubspec.yaml'

# Allow the built-in token to push the new tag.
permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read mobile marketing version
        id: version
        run: |
          version="$(grep -E '^version:' meeting-note-mobile/app/pubspec.yaml \
            | sed -E 's/^version:[[:space:]]*([^+ ]+).*/\1/')"
          if [ -z "$version" ]; then
            echo "Could not parse a version from pubspec.yaml" >&2
            exit 1
          fi
          echo "tag=mobile-v${version}" >> "$GITHUB_OUTPUT"
          echo "Mobile version: ${version} -> tag mobile-v${version}"

      - name: Create and push tag if it does not exist
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists on origin; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Mobile release ${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          echo "Created and pushed ${TAG} at ${GITHUB_SHA}"
