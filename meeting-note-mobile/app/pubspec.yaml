name: meeting_note_mobile
description: Meeting Note — AI meeting transcription & summary (mobile)
publish_to: "none"
version: 0.1.1+2004

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  dio: ^5.5.0
  record: ^7.1.1
  file_picker: ^11.0.2
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  flutter_markdown: ^0.7.3
  intl: ^0.19.0
  msal_auth: ^3.5.1
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Integrate iOS plugins through CocoaPods, not Swift Package Manager.
  # msal_auth requires iOS 16, but Flutter generates its plugin SwiftPackage
  # with its own default of iOS 13 and only rewrites it to the project's
  # deployment target from inside the flutter build pipeline. Anything that
  # regenerates that file (flutter pub get, an Xcode-driven build) leaves it at
  # 13 and Xcode then fails package resolution with "The package product
  # 'msal-auth' requires minimum platform version 16.0 ... but this target
  # supports 13.0". CocoaPods reads each pod's own minimum, so the mismatch
  # cannot happen.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  assets:
    - assets/msal_config.json
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
